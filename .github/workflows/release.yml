name: Release Extensions

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_firefox:
        description: "Submit this version to Firefox Add-ons"
        type: boolean
        default: false
      publish_edge:
        description: "Submit this version to Microsoft Edge Add-ons"
        type: boolean
        default: false
      create_github_release:
        description: "Create or update a GitHub release"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  package:
    name: Lint and package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.manifest.outputs.version }}
      artifact_name: ${{ steps.manifest.outputs.artifact_name }}
      package_name: ${{ steps.manifest.outputs.package_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Read manifest version
        id: manifest
        run: |
          version="$(node -p "require('./manifest.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact_name=thisip-extension-$version" >> "$GITHUB_OUTPUT"
          echo "package_name=thisip-$version.zip" >> "$GITHUB_OUTPUT"

      - name: Ensure tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v${{ steps.manifest.outputs.version }}"
          if [ "${GITHUB_REF_NAME}" != "$expected" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version $expected" >&2
            exit 1
          fi

      - name: Lint extension
        run: npx --yes web-ext lint -c web-ext.config.cjs

      - name: Build extension package
        run: |
          rm -rf web-ext-artifacts dist
          npx --yes web-ext build -c web-ext.config.cjs --overwrite-dest
          mkdir -p dist
          cp web-ext-artifacts/*.zip "dist/${{ steps.manifest.outputs.package_name }}"
          unzip -l "dist/${{ steps.manifest.outputs.package_name }}" manifest.json

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.manifest.outputs.artifact_name }}
          path: dist/${{ steps.manifest.outputs.package_name }}
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: package
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.create_github_release)
    permissions:
      contents: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: dist

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          PACKAGE_PATH: dist/${{ needs.package.outputs.package_name }}
        run: |
          if ! [[ "$TAG_NAME" == v* ]]; then
            TAG_NAME="v${{ needs.package.outputs.version }}"
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$PACKAGE_PATH" --clobber
          else
            gh release create "$TAG_NAME" "$PACKAGE_PATH" \
              --target "$GITHUB_SHA" \
              --title "$TAG_NAME" \
              --notes "Automated release for $TAG_NAME."
          fi

  publish-firefox:
    name: Publish to Firefox Add-ons
    needs: package
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_firefox)
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Submit listed add-on to AMO
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "Missing AMO_JWT_ISSUER or AMO_JWT_SECRET repository secrets." >&2
            exit 1
          fi

          npx --yes web-ext sign -c web-ext.config.cjs \
            --channel=listed \
            --api-key="$AMO_JWT_ISSUER" \
            --api-secret="$AMO_JWT_SECRET" \
            --approval-timeout=0

  publish-edge:
    name: Publish to Microsoft Edge Add-ons
    needs: package
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_edge)
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: dist

      - name: Submit update to Edge Add-ons
        env:
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PACKAGE_PATH: dist/${{ needs.package.outputs.package_name }}
          EDGE_CERTIFICATION_NOTES: "Automated release from ${{ github.repository }} at ${{ github.sha }}."
        run: node .github/scripts/publish-edge-addons.mjs
